<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AeroCalc | Precision Calculator</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          boxShadow: {
            'glow-cyan': '0 0 25px -4px rgba(6, 182, 212, 0.45)',
            'glow-amber': '0 0 25px -4px rgba(245, 158, 11, 0.45)',
            'calc-glass': '0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 1px 1px rgba(255, 255, 255, 0.1)',
            'calc-light': '0 20px 45px -15px rgba(100, 116, 139, 0.25), 0 0 0 1px rgba(226, 232, 240, 0.8)',
          }
        }
      }
    }
  </script>

  <style>
    /* Touch optimization */
    body {
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Calculator tactile buttons */
    .calc-btn {
      position: relative;
      transition: all 0.12s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }
    .calc-btn:hover {
      filter: brightness(1.08);
    }
    .calc-btn:active, .calc-btn.btn-active {
      transform: scale(0.92);
      filter: brightness(0.92);
    }

    /* Custom scrollbar for history tape */
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.5);
    }

    /* Pulse animation for preview */
    @keyframes subtlePulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 0.45; }
    }
    .preview-pulsing {
      animation: subtlePulse 1.8s infinite ease-in-out;
    }
  </style>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased transition-colors duration-300 flex items-center justify-center p-3 sm:p-6 relative overflow-hidden select-none">

  <!-- Background decorative light blooms -->
  <div class="fixed -top-40 -left-40 w-96 h-96 bg-cyan-500/15 dark:bg-cyan-500/10 rounded-full blur-3xl pointer-events-none transition-colors duration-500"></div>
  <div class="fixed -bottom-40 -right-40 w-96 h-96 bg-indigo-500/15 dark:bg-indigo-500/10 rounded-full blur-3xl pointer-events-none transition-colors duration-500"></div>

  <main class="w-full max-w-[390px] bg-slate-900/90 dark:bg-slate-900/90 backdrop-blur-2xl rounded-[2.5rem] border border-slate-700/50 shadow-calc-glass relative z-10 flex flex-col overflow-hidden transition-all duration-300">

    <!-- Top Navigation & Controls Header -->
    <header class="flex items-center justify-between px-6 pt-5 pb-3">
      <div class="flex items-center space-x-2">
        <span class="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 text-white font-mono font-bold text-base shadow-sm">
          =
        </span>
        <h1 class="text-sm font-semibold tracking-wider uppercase text-slate-400">AeroCalc</h1>
      </div>

      <!-- Quick action controls (Sound, Theme, History Drawer) -->
      <div class="flex items-center space-x-1.5 bg-slate-800/70 dark:bg-slate-800/70 p-1 rounded-2xl border border-slate-700/50">
        <!-- Sound Effect Toggle -->
        <button id="soundToggleBtn" aria-label="Toggle mechanical sound" class="p-2 rounded-xl text-slate-400 hover:text-slate-200 transition-colors">
          <i data-lucide="volume-2" class="w-4 h-4"></i>
        </button>

        <!-- Theme Color Accents Toggle -->
        <button id="themeToggleBtn" aria-label="Toggle neon theme" class="p-2 rounded-xl text-cyan-400 hover:text-cyan-300 transition-colors">
          <i data-lucide="palette" class="w-4 h-4"></i>
        </button>

        <!-- History Tape Drawer Toggle -->
        <button id="historyDrawerBtn" aria-label="Open history log" class="p-2 rounded-xl text-slate-400 hover:text-slate-200 relative transition-colors">
          <i data-lucide="history" class="w-4 h-4"></i>
          <span id="historyBadge" class="hidden absolute top-1 right-1 w-2 h-2 rounded-full bg-cyan-400 ring-2 ring-slate-900"></span>
        </button>
      </div>
    </header>

    <section class="px-6 py-4 flex flex-col justify-end items-end min-h-[145px] max-h-[175px] bg-slate-950/40 border-y border-slate-800/60 font-mono relative overflow-hidden" aria-live="polite">
      <!-- Live Running Equation / Expression Line -->
      <div id="equationDisplay" class="w-full text-right text-sm sm:text-base text-slate-400 truncate tracking-wide min-h-[1.5rem] transition-all">
        <!-- Dynamic expression content populated by JS -->
      </div>

      <!-- Real-time Result Preview Sub-line -->
      <div id="previewDisplay" class="w-full text-right text-xs sm:text-sm font-medium text-cyan-400/80 truncate tracking-wider min-h-[1.25rem] mt-0.5 preview-pulsing">
        <!-- Anticipated result preview -->
      </div>

      <!-- Active Primary Input / Evaluated Result Line -->
      <div id="activeDisplay" class="w-full text-right text-4xl sm:text-5xl font-bold tracking-tight text-white truncate mt-1 transition-all">
        0
      </div>

      <!-- Toast Feedback (e.g. Copied to Clipboard, Div by zero) -->
      <div id="toastNotification" class="absolute bottom-2 left-6 right-6 text-center py-1 px-3 rounded-full bg-rose-500/90 text-white text-xs font-sans font-medium transform translate-y-8 opacity-0 pointer-events-none transition-all duration-200 shadow-md">
        Cannot divide by zero
      </div>
    </section>

    <section class="p-5 grid grid-cols-4 gap-3 bg-slate-900/60 select-none" id="keypad">
      <!-- Row 1: Clear, Toggle Sign, Percentage, Division -->
      <button data-action="clear" class="calc-btn h-14 rounded-2xl bg-rose-500/15 hover:bg-rose-500/25 active:bg-rose-500/30 text-rose-400 border border-rose-500/30 font-semibold text-base flex items-center justify-center">
        AC
      </button>
      <button data-action="negate" class="calc-btn h-14 rounded-2xl bg-slate-800 hover:bg-slate-700/80 active:bg-slate-700 text-slate-300 border border-slate-700/50 font-medium text-lg flex items-center justify-center">
        +/−
      </button>
      <button data-action="percent" class="calc-btn h-14 rounded-2xl bg-slate-800 hover:bg-slate-700/80 active:bg-slate-700 text-slate-300 border border-slate-700/50 font-medium text-lg flex items-center justify-center">
        %
      </button>
      <button data-operator="÷" class="calc-btn h-14 rounded-2xl bg-cyan-600/20 hover:bg-cyan-600/30 active:bg-cyan-600/40 text-cyan-400 border border-cyan-500/40 font-mono font-bold text-2xl flex items-center justify-center">
        ÷
      </button>

      <!-- Row 2: 7, 8, 9, Multiplication -->
      <button data-digit="7" class="calc-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/90 active:bg-slate-700 text-slate-100 border border-slate-700/40 font-mono text-xl font-medium flex items-center justify-center">
        7
      </button>
      <button data-digit="8" class="calc-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/90 active:bg-slate-700 text-slate-100 border border-slate-700/40 font-mono text-xl font-medium flex items-center justify-center">
        8
      </button>
      <button data-digit="9" class="calc-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/90 active:bg-slate-700 text-slate-100 border border-slate-700/40 font-mono text-xl font-medium flex items-center justify-center">
        9
      </button>
      <button data-operator="×" class="calc-btn h-14 rounded-2xl bg-cyan-600/20 hover:bg-cyan-600/30 active:bg-cyan-600/40 text-cyan-400 border border-cyan-500/40 font-mono font-bold text-2xl flex items-center justify-center">
        ×
      </button>

      <!-- Row 3: 4, 5, 6, Subtraction -->
      <button data-digit="4" class="calc-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/90 active:bg-slate-700 text-slate-100 border border-slate-700/40 font-mono text-xl font-medium flex items-center justify-center">
        4
      </button>
      <button data-digit="5" class="calc-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/90 active:bg-slate-700 text-slate-100 border border-slate-700/40 font-mono text-xl font-medium flex items-center justify-center">
        5
      </button>
      <button data-digit="6" class="calc-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/90 active:bg-slate-700 text-slate-100 border border-slate-700/40 font-mono text-xl font-medium flex items-center justify-center">
        6
      </button>
      <button data-operator="−" class="calc-btn h-14 rounded-2xl bg-cyan-600/20 hover:bg-cyan-600/30 active:bg-cyan-600/40 text-cyan-400 border border-cyan-500/40 font-mono font-bold text-2xl flex items-center justify-center">
        −
      </button>

      <!-- Row 4: 1, 2, 3, Addition -->
      <button data-digit="1" class="calc-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/90 active:bg-slate-700 text-slate-100 border border-slate-700/40 font-mono text-xl font-medium flex items-center justify-center">
        1
      </button>
      <button data-digit="2" class="calc-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/90 active:bg-slate-700 text-slate-100 border border-slate-700/40 font-mono text-xl font-medium flex items-center justify-center">
        2
      </button>
      <button data-digit="3" class="calc-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/90 active:bg-slate-700 text-slate-100 border border-slate-700/40 font-mono text-xl font-medium flex items-center justify-center">
        3
      </button>
      <button data-operator="+" class="calc-btn h-14 rounded-2xl bg-cyan-600/20 hover:bg-cyan-600/30 active:bg-cyan-600/40 text-cyan-400 border border-cyan-500/40 font-mono font-bold text-2xl flex items-center justify-center">
        +
      </button>

      <!-- Row 5: 0, Decimal, Backspace, Equals -->
      <button data-digit="0" class="calc-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/90 active:bg-slate-700 text-slate-100 border border-slate-700/40 font-mono text-xl font-medium flex items-center justify-center">
        0
      </button>
      <button data-action="decimal" class="calc-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/90 active:bg-slate-700 text-slate-100 border border-slate-700/40 font-mono text-2xl font-bold flex items-center justify-center">
        .
      </button>
      <button data-action="backspace" aria-label="Backspace" class="calc-btn h-14 rounded-2xl bg-slate-800/80 hover:bg-slate-700/90 active:bg-slate-700 text-slate-300 border border-slate-700/40 flex items-center justify-center">
        <i data-lucide="delete" class="w-5 h-5"></i>
      </button>
      <button id="equalsBtn" data-action="calculate" class="calc-btn h-14 rounded-2xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-mono font-bold text-2xl shadow-glow-cyan flex items-center justify-center">
        =
      </button>
    </section>

    <div id="historyDrawer" class="absolute inset-0 bg-slate-900/95 backdrop-blur-xl z-20 transform translate-x-full transition-transform duration-300 ease-out flex flex-col p-6">
      <div class="flex items-center justify-between pb-4 border-b border-slate-800">
        <div class="flex items-center space-x-2">
          <i data-lucide="history" class="w-5 h-5 text-cyan-400"></i>
          <h2 class="text-base font-semibold text-slate-200">Calculation Tape</h2>
        </div>
        <div class="flex items-center space-x-1">
          <button id="clearHistoryBtn" aria-label="Clear history" class="p-1.5 text-slate-400 hover:text-rose-400 transition-colors rounded-lg hover:bg-slate-800">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
          <button id="closeDrawerBtn" aria-label="Close history drawer" class="p-1.5 text-slate-400 hover:text-slate-100 transition-colors rounded-lg hover:bg-slate-800">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- History log list -->
      <div id="historyList" class="flex-1 overflow-y-auto py-3 space-y-2.5 custom-scroll text-right font-mono">
        <div id="emptyHistoryState" class="h-full flex flex-col items-center justify-center text-center p-6 text-slate-500">
          <i data-lucide="calculator" class="w-10 h-10 mb-2 stroke-1"></i>
          <p class="text-sm font-sans">No calculations yet</p>
          <span class="text-xs font-sans text-slate-600">Calculated expressions will appear here</span>
        </div>
      </div>

      <div class="pt-3 border-t border-slate-800/80 text-xs text-slate-400 font-sans text-center">
        Click any past entry to recall its result.
      </div>
    </div>
  </main>

  <script>
    // State machine management
    const state = {
      currentOperand: '0',
      previousOperand: null,
      operator: null,
      overwriteCurrent: false,
      history: [],
      soundEnabled: true,
      currentTheme: 'cyan', // 'cyan' | 'amber' | 'emerald'
    };

    // DOM Elements
    const activeDisplay = document.getElementById('activeDisplay');
    const equationDisplay = document.getElementById('equationDisplay');
    const previewDisplay = document.getElementById('previewDisplay');
    const toastNotification = document.getElementById('toastNotification');
    const historyDrawer = document.getElementById('historyDrawer');
    const historyList = document.getElementById('historyList');
    const emptyHistoryState = document.getElementById('emptyHistoryState');
    const historyBadge = document.getElementById('historyBadge');
    const historyDrawerBtn = document.getElementById('historyDrawerBtn');
    const closeDrawerBtn = document.getElementById('closeDrawerBtn');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const equalsBtn = document.getElementById('equalsBtn');

    // Initialize Lucide icons
    lucide.createIcons();

    let audioCtx = null;
    function playTactileClick(type = 'digit') {
      if (!state.soundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        const now = audioCtx.currentTime;
        let freq = 600;
        let duration = 0.025;

        if (type === 'operator') {
          freq = 420;
          duration = 0.035;
        } else if (type === 'calculate') {
          freq = 820;
          duration = 0.045;
        } else if (type === 'clear') {
          freq = 280;
          duration = 0.03;
        }

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.4, now + duration);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + duration);
      } catch (err) {
        console.warn('Audio playback inhibited:', err);
      }
    }

    function roundPrecision(num, decimals = 10) {
      if (!isFinite(num)) return num;
      return Number(Math.round(Number(num + 'e' + decimals)) + 'e-' + decimals);
    }

    function formatNumber(numberStr) {
      if (numberStr === 'Cannot divide by zero' || numberStr === 'Error') return numberStr;
      if (!numberStr) return '0';

      const parts = numberStr.toString().split('.');
      const integerPart = parts[0];
      const decimalPart = parts[1];

      // Format integer part with locale commas
      const formattedInt = isNaN(Number(integerPart)) 
        ? integerPart 
        : Number(integerPart).toLocaleString('en-US');

      if (decimalPart !== undefined) {
        return `${formattedInt}.${decimalPart}`;
      }
      return formattedInt;
    }

    function compute(a, b, op) {
      const numA = parseFloat(a);
      const numB = parseFloat(b);

      if (isNaN(numA) || isNaN(numB)) return null;

      let result = 0;
      switch (op) {
        case '+':
          result = numA + numB;
          break;
        case '−':
        case '-':
          result = numA - numB;
          break;
        case '×':
        case '*':
          result = numA * numB;
          break;
        case '÷':
        case '/':
          if (numB === 0) return 'Cannot divide by zero';
          result = numA / numB;
          break;
        default:
          return null;
      }
      return roundPrecision(result);
    }

    // Show temporary toast feedback
    let toastTimeout;
    function showToast(message, isError = true) {
      clearTimeout(toastTimeout);
      toastNotification.textContent = message;
      toastNotification.className = `absolute bottom-2 left-6 right-6 text-center py-1.5 px-3 rounded-full ${
        isError ? 'bg-rose-500/90 text-white' : 'bg-cyan-500/90 text-white'
      } text-xs font-sans font-medium transform translate-y-0 opacity-100 transition-all duration-200 shadow-md`;

      toastTimeout = setTimeout(() => {
        toastNotification.className = toastNotification.className.replace('translate-y-0 opacity-100', 'translate-y-8 opacity-0');
      }, 2400);
    }

    function updateDisplay() {
      // Main Active Display Text
      activeDisplay.textContent = formatNumber(state.currentOperand);

      // Dynamic Auto-scaling for long outputs
      const charCount = state.currentOperand.length;
      if (charCount > 13) {
        activeDisplay.className = activeDisplay.className.replace(/text-[2-5]xl/g, 'text-2xl');
      } else if (charCount > 9) {
        activeDisplay.className = activeDisplay.className.replace(/text-[2-5]xl/g, 'text-3xl');
      } else {
        activeDisplay.className = activeDisplay.className.replace(/text-[2-5]xl/g, 'text-5xl');
      }

      // Equation top line display
      if (state.previousOperand !== null && state.operator !== null) {
        equationDisplay.textContent = `${formatNumber(state.previousOperand)} ${state.operator}`;
      } else {
        equationDisplay.textContent = '';
      }

      // Real-time Preview Calculation
      if (state.previousOperand !== null && state.operator !== null && !state.overwriteCurrent && state.currentOperand !== '') {
        const preview = compute(state.previousOperand, state.currentOperand, state.operator);
        if (preview === 'Cannot divide by zero') {
          previewDisplay.textContent = 'Division by zero';
        } else if (preview !== null) {
          previewDisplay.textContent = `= ${formatNumber(preview.toString())}`;
        } else {
          previewDisplay.textContent = '';
        }
      } else {
        previewDisplay.textContent = '';
      }
    }

    function inputDigit(digit) {
      playTactileClick('digit');

      if (state.overwriteCurrent || state.currentOperand === '0') {
        state.currentOperand = digit;
        state.overwriteCurrent = false;
      } else {
        // Prevent display overflow limit
        if (state.currentOperand.replace('.', '').length >= 15) return;
        state.currentOperand += digit;
      }
      updateDisplay();
    }

    function inputDecimal() {
      playTactileClick('digit');

      if (state.overwriteCurrent) {
        state.currentOperand = '0.';
        state.overwriteCurrent = false;
        updateDisplay();
        return;
      }

      if (!state.currentOperand.includes('.')) {
        state.currentOperand += '.';
      }
      updateDisplay();
    }

    function handleOperator(op) {
      playTactileClick('operator');

      if (state.currentOperand === 'Cannot divide by zero') {
        clearAll();
        return;
      }

      // Continuous chaining calculation if operator is pressed sequentially
      if (state.operator !== null && !state.overwriteCurrent) {
        evaluateCalculation(false);
      }

      state.previousOperand = state.currentOperand;
      state.operator = op;
      state.overwriteCurrent = true;
      updateDisplay();
    }

    function evaluateCalculation(isFinal = true) {
      if (state.operator === null || state.previousOperand === null) return;

      const result = compute(state.previousOperand, state.currentOperand, state.operator);

      if (result === 'Cannot divide by zero') {
        playTactileClick('clear');
        showToast('Cannot divide by zero');
        state.currentOperand = '0';
        state.previousOperand = null;
        state.operator = null;
        state.overwriteCurrent = true;
        updateDisplay();
        return;
      }

      if (result !== null) {
        playTactileClick(isFinal ? 'calculate' : 'operator');

        // Record in calculation history tape
        if (isFinal) {
          addHistoryRecord({
            expr: `${formatNumber(state.previousOperand)} ${state.operator} ${formatNumber(state.currentOperand)}`,
            result: result.toString(),
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
        }

        state.currentOperand = result.toString();
        if (isFinal) {
          state.previousOperand = null;
          state.operator = null;
        } else {
          state.previousOperand = result.toString();
        }
        state.overwriteCurrent = true;
        updateDisplay();
      }
    }

    function clearAll() {
      playTactileClick('clear');
      state.currentOperand = '0';
      state.previousOperand = null;
      state.operator = null;
      state.overwriteCurrent = false;
      updateDisplay();
    }

    function backspace() {
      playTactileClick('digit');
      if (state.overwriteCurrent) {
        state.currentOperand = '0';
        state.overwriteCurrent = false;
      } else if (state.currentOperand.length > 1) {
        state.currentOperand = state.currentOperand.slice(0, -1);
      } else {
        state.currentOperand = '0';
      }
      updateDisplay();
    }

    function toggleSign() {
      playTactileClick('digit');
      if (state.currentOperand === '0') return;
      state.currentOperand = (parseFloat(state.currentOperand) * -1).toString();
      updateDisplay();
    }

    function applyPercentage() {
      playTactileClick('operator');
      const val = parseFloat(state.currentOperand);
      if (isNaN(val)) return;

      // In chained operations (e.g. 200 + 10%), calculate percentage of previous operand
      if (state.previousOperand !== null && (state.operator === '+' || state.operator === '−' || state.operator === '-')) {
        const base = parseFloat(state.previousOperand);
        state.currentOperand = roundPrecision((base * val) / 100).toString();
      } else {
        state.currentOperand = roundPrecision(val / 100).toString();
      }
      updateDisplay();
    }

    function addHistoryRecord(record) {
      state.history.unshift(record);
      renderHistory();
      historyBadge.classList.remove('hidden');
    }

    function renderHistory() {
      if (state.history.length === 0) {
        emptyHistoryState.classList.remove('hidden');
        historyList.innerHTML = '';
        historyList.appendChild(emptyHistoryState);
        return;
      }

      emptyHistoryState.classList.add('hidden');
      historyList.innerHTML = '';

      state.history.forEach((item, index) => {
        const itemEl = document.createElement('div');
        itemEl.className = 'group p-2.5 rounded-xl hover:bg-slate-800/80 active:bg-slate-800 border border-transparent hover:border-slate-700/60 cursor-pointer transition-all';
        itemEl.innerHTML = `
          <div class="flex items-center justify-between text-xs text-slate-500 font-sans mb-1">
            <span>${item.time}</span>
            <span class="opacity-0 group-hover:opacity-100 text-cyan-400 font-medium text-[11px] transition-opacity">Recall ↵</span>
          </div>
          <div class="text-xs text-slate-400 truncate">${item.expr}</div>
          <div class="text-lg font-bold text-slate-100 group-hover:text-cyan-300 transition-colors mt-0.5">= ${formatNumber(item.result)}</div>
        `;
        itemEl.addEventListener('click', () => {
          playTactileClick('digit');
          state.currentOperand = item.result;
          state.overwriteCurrent = true;
          updateDisplay();
          toggleDrawer(false);
          showToast(`Recalled ${formatNumber(item.result)}`, false);
        });
        historyList.appendChild(itemEl);
      });
    }

    function toggleDrawer(isOpen) {
      if (isOpen) {
        historyDrawer.classList.remove('translate-x-full');
        historyBadge.classList.add('hidden');
      } else {
        historyDrawer.classList.add('translate-x-full');
      }
    }

    const themes = [
      { name: 'cyan', gradient: 'from-cyan-500 to-blue-600', shadow: 'shadow-glow-cyan', text: 'text-cyan-400', border: 'border-cyan-500/40' },
      { name: 'amber', gradient: 'from-amber-500 to-orange-600', shadow: 'shadow-glow-amber', text: 'text-amber-400', border: 'border-amber-500/40' },
      { name: 'emerald', gradient: 'from-emerald-500 to-teal-600', shadow: 'shadow-glow-cyan', text: 'text-emerald-400', border: 'border-emerald-500/40' },
    ];
    let activeThemeIndex = 0;

    themeToggleBtn.addEventListener('click', () => {
      activeThemeIndex = (activeThemeIndex + 1) % themes.length;
      const th = themes[activeThemeIndex];
      equalsBtn.className = `calc-btn h-14 rounded-2xl bg-gradient-to-r ${th.gradient} text-white font-mono font-bold text-2xl ${th.shadow} flex items-center justify-center`;
      themeToggleBtn.className = `p-2 rounded-xl ${th.text} transition-colors`;
      playTactileClick('operator');
    });

    soundToggleBtn.addEventListener('click', () => {
      state.soundEnabled = !state.soundEnabled;
      soundToggleBtn.innerHTML = state.soundEnabled 
        ? '<i data-lucide="volume-2" class="w-4 h-4"></i>' 
        : '<i data-lucide="volume-x" class="w-4 h-4 text-slate-500"></i>';
      lucide.createIcons();
    });

    historyDrawerBtn.addEventListener('click', () => toggleDrawer(true));
    closeDrawerBtn.addEventListener('click', () => toggleDrawer(false));
    clearHistoryBtn.addEventListener('click', () => {
      playTactileClick('clear');
      state.history = [];
      renderHistory();
    });

    document.getElementById('keypad').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;

      if (btn.dataset.digit) {
        inputDigit(btn.dataset.digit);
      } else if (btn.dataset.operator) {
        handleOperator(btn.dataset.operator);
      } else if (btn.dataset.action) {
        switch (btn.dataset.action) {
          case 'clear':
            clearAll();
            break;
          case 'decimal':
            inputDecimal();
            break;
          case 'calculate':
            evaluateCalculation(true);
            break;
          case 'backspace':
            backspace();
            break;
          case 'negate':
            toggleSign();
            break;
          case 'percent':
            applyPercentage();
            break;
        }
      }
    });

    window.addEventListener('keydown', (e) => {
      // Prevent default browser shortcuts for math keys
      if (['/', '*', '+', '-', '%', 'Enter', '='].includes(e.key)) {
        e.preventDefault();
      }

      let targetBtn = null;

      if (!isNaN(e.key) && e.key !== ' ') {
        inputDigit(e.key);
        targetBtn = document.querySelector(`[data-digit="${e.key}"]`);
      } else if (e.key === '.') {
        inputDecimal();
        targetBtn = document.querySelector('[data-action="decimal"]');
      } else if (e.key === '+' || e.key === '-') {
        const symbol = e.key === '+' ? '+' : '−';
        handleOperator(symbol);
        targetBtn = document.querySelector(`[data-operator="${symbol}"]`);
      } else if (e.key === '*') {
        handleOperator('×');
        targetBtn = document.querySelector('[data-operator="×"]');
      } else if (e.key === '/') {
        handleOperator('÷');
        targetBtn = document.querySelector('[data-operator="÷"]');
      } else if (e.key === 'Enter' || e.key === '=') {
        evaluateCalculation(true);
        targetBtn = equalsBtn;
      } else if (e.key === 'Backspace') {
        backspace();
        targetBtn = document.querySelector('[data-action="backspace"]');
      } else if (e.key === 'Escape') {
        clearAll();
        targetBtn = document.querySelector('[data-action="clear"]');
      } else if (e.key === '%') {
        applyPercentage();
        targetBtn = document.querySelector('[data-action="percent"]');
      }

      // Add temporary visual feedback class to mapped button
      if (targetBtn) {
        targetBtn.classList.add('btn-active');
        setTimeout(() => targetBtn.classList.remove('btn-active'), 120);
      }
    });

    // Initialize display state on startup
    updateDisplay();
  </script>
</body>
</html>
